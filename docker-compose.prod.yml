services:
  api:
    build:
      context: ./backend
    container_name: velox-prod-api
    restart: always
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/data/velox.db
      - DEBUG=False
      - JWT_SECRET_KEY=velox-prod-jwt-secret-nexoratech-2026
      - CORS_ORIGINS=["*"]
    volumes:
      - velox_prod_data:/app/data
    ports:
      - "127.0.0.1:8088:8000"
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./frontend
    container_name: velox-prod-web
    restart: always
    ports:
      - "127.0.0.1:88:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  velox_prod_data:
